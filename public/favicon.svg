<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" fill="none">
  <defs>
    <!-- Rich Gold Linear Gradient -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2B2" />
      <stop offset="25%" stopColor="#F5C842" />
      <stop offset="55%" stopColor="#D4AF37" />
      <stop offset="80%" stopColor="#A87910" />
      <stop offset="100%" stopColor="#E2B743" />
    </linearGradient>

    <!-- Specular Highlight Gold -->
    <linearGradient id="fav-shine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#C59B27" />
      <stop offset="35%" stopColor="#FFFFFF" />
      <stop offset="70%" stopColor="#E5C158" />
      <stop offset="100%" stopColor="#8C6207" />
    </linearGradient>

    <!-- Contrast outline for light and dark browser tabs -->
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" floodColor="#000000" floodOpacity="0.75" />
    </filter>
  </defs>

  <!-- 100% Transparent Background (No dark rectangle) -->
  <g filter="url(#fav-shadow)" transform="translate(0, 2)">
    <!-- W - Left Main Outer Stem -->
    <path d="M 10 12 L 36 82 L 44 82 L 18 12 Z" fill="url(#fav-gold)" />
    
    <!-- W - Left Inner Line -->
    <path d="M 26 12 L 44 64 L 48 64 L 31 12 Z" fill="url(#fav-shine)" />

    <!-- W - Right Main Outer Stem -->
    <path d="M 84 12 L 58 82 L 50 82 L 76 12 Z" fill="url(#fav-gold)" />

    <!-- W - Right Inner Line -->
    <path d="M 68 12 L 50 64 L 46 64 L 63 12 Z" fill="url(#fav-shine)" />

    <!-- Serif Caps -->
    <path d="M 6 12 L 32 12 L 30 15 L 8 15 Z" fill="url(#fav-shine)" />
    <path d="M 62 12 L 88 12 L 86 15 L 64 15 Z" fill="url(#fav-shine)" />

    <!-- Intertwining S -->
    <path d="M 90 16 C 90 9, 81 4, 64 4 C 46 4, 37 11, 37 22 C 37 32, 44 37, 58 42 L 68 45 C 81 50, 87 56, 87 66 C 87 79, 75 88, 56 88 C 39 88, 29 81, 27 70 L 34 68 C 36 77, 44 82, 56 82 C 71 82, 80 75, 80 66 C 80 57, 74 52, 60 47 L 50 44 C 38 39, 30 33, 30 22 C 30 8, 44 0, 64 0 C 84 0, 96 8, 96 16 Z" fill="url(#fav-shine)" />
  </g>
</svg>
